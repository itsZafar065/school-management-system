version: "3.9"

services:
  backend:
    build:
      context: ./express-backend
    container_name: sms_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: school_management_jwt_secret_key_2026_secure
      NODE_ENV: production
    volumes:
      - ./express-backend/prisma:/app/prisma

  frontend:
    build:
      context: ./frontend
    container_name: sms_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend
